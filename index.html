<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>꿈지기 기사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--panel:rgba(18,15,29,.82);--line:rgba(255,255,255,.12);--text:#f4f1ff;--sub:#a9a3c4;--gold:#ffd23a;--hp:#5ad87a;--hplow:#ff5a5f;--xp:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120f1d;color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#txt{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none;display:none;font-weight:700;text-shadow:0 1px 0 #120f1d,0 0 4px rgba(18,15,29,.8)}
.bar{position:relative;height:14px;border-radius:7px;background:rgba(18,15,29,.75);border:1px solid var(--line);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hp);transition:width .12s}
.bar>em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:13px;text-align:center}
#tl{position:absolute;left:14px;top:12px;width:min(300px,34vw)}
#xpb{height:8px;margin-top:5px}#xpb>i{background:var(--xp)}
#stats{margin-top:6px;font-size:13px}#stats b{color:var(--gold)}
#hname{font-size:12px;margin-top:2px}
#tc{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:13px}
#timer{font-size:26px;font-weight:900;line-height:1.15}#timer.red{color:var(--hplow)}
#winfo{font-size:12px;color:var(--sub)}
#mini{position:absolute;right:14px;top:12px;width:96px;height:96px;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated;background:#120f1d}
#bossbar{position:absolute;left:50%;top:84px;width:min(440px,70vw);transform:translateX(-50%);display:none;text-align:center;font-size:13px}
#bossbar .bar{height:12px;margin-top:3px}#bossbar .bar>i{background:#ff5a8a}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(8px)}
#banner.on{opacity:1;transform:none}
#banner b{display:block;font-size:34px;font-weight:900}#banner span{font-size:15px;color:var(--sub)}
#toasts{position:absolute;left:50%;top:132px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:13px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#prompt{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:14px;display:none;white-space:nowrap}
#skills{position:absolute;left:14px;bottom:34px;display:flex;gap:8px}
.sk{position:relative;width:58px;height:58px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:10px;line-height:1.2;text-align:center;padding:16px 3px 0;overflow:hidden}
.sk b{position:absolute;left:4px;top:3px;font-size:10px;color:var(--sub)}
.sk .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--text);opacity:.75}
.sk.lock{color:var(--sub);border-style:dashed}
#ultw{position:absolute;right:16px;bottom:34px;width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--line);overflow:hidden;text-align:center}
#ultw i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,210,58,.5)}
#ultw span{position:relative;line-height:60px;font-size:18px;font-weight:900}
#ultw.ready{border-color:var(--gold);border-width:3px}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:var(--sub)}
#dbg{position:absolute;left:14px;top:120px;font:11px monospace;color:#9f9;display:none;white-space:pre}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,60,0) 55%,rgba(255,40,60,.55) 100%)}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#joy{position:absolute;left:calc(28px + env(safe-area-inset-left, 0px));bottom:calc(28px + env(safe-area-inset-bottom, 0px));width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(18,15,29,.35)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.45)}
#actBtn{display:none;left:50%!important;top:64%;transform:translate(-50%,-50%);width:auto!important;min-width:132px;height:52px!important;border-radius:26px!important;padding:0 22px;font-size:16px!important;border:2px solid rgba(255,255,255,.35)!important;background:#3fbf6a!important;color:#fff!important;box-shadow:0 3px 0 #237a40}
#actBtn.off{background:#6a6878!important;box-shadow:0 3px 0 #3e3c4a;color:#d8d6e2!important}
body.touch .pcOnly,body.touch #hint,body.touchP #hint{display:none!important}
body.touchP #prompt{pointer-events:auto;cursor:pointer}
body.touchP #joy{bottom:calc(112px + env(safe-area-inset-bottom, 0px))}
body.touchP #bJump{bottom:calc(120px + env(safe-area-inset-bottom, 0px))}body.touchP #bUlt{bottom:calc(176px + env(safe-area-inset-bottom, 0px))}
body.touch #skills{left:calc(14px + env(safe-area-inset-left, 0px));bottom:auto;top:104px;gap:5px}
body.touch .sk{width:46px;height:46px;padding-top:14px;font-size:9px}
#heroPic canvas{image-rendering:pixelated;display:block;margin:0 auto}
body.touch #ultw{display:none}
#touch button{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);font:900 14px 'Noto Sans KR',system-ui;touch-action:none}
#bJump{right:calc(96px + env(safe-area-inset-right, 0px));bottom:calc(40px + env(safe-area-inset-bottom, 0px));width:68px!important;height:68px!important}#bUlt{right:calc(20px + env(safe-area-inset-right, 0px));bottom:calc(96px + env(safe-area-inset-bottom, 0px))}#bPause{right:14px;top:120px;width:44px!important;height:44px!important}
#ov{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(10,8,20,.62);padding:16px;overflow:auto}
#ov.on{display:flex}
.panel{margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:900px;width:100%;text-align:center;backdrop-filter:blur(4px)}
.panel h1{font-weight:900;font-size:40px;margin:0 0 4px;letter-spacing:-1px}
.panel h2{font-weight:900;font-size:24px;margin:0 0 6px}
.panel p{color:var(--sub);margin:4px 0 14px;font-size:14px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.card{position:relative;width:220px;min-height:190px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid var(--line);padding:30px 14px 34px;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s;font-family:inherit;color:inherit}
.card:hover,.card.sel{transform:translateY(-4px);border-color:var(--gold)}
.card .tag{position:absolute;left:0;right:0;top:0;padding:4px 10px;border-radius:10px 10px 0 0;font-size:11px;font-weight:900;color:#120f1d}
.card .nm{font-size:18px;font-weight:900;margin:4px 0 6px}
.card .ds{font-size:12px;color:var(--sub);line-height:1.5}
.card .ky{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--sub)}
.card canvas{image-rendering:pixelated;display:block;margin:0 auto 6px}
.ic{image-rendering:pixelated;display:block;margin:2px 0 6px}
.card .row2{display:flex;gap:10px;align-items:center}.card .row2 .nm{margin:0}
.sk img{position:absolute;inset:0;width:100%;height:100%;opacity:.4;image-rendering:pixelated;z-index:0}.sk b,.sk span,.sk .cd{z-index:1}.sk span{position:relative}
.build img{width:20px;height:20px;vertical-align:middle;margin-right:4px;image-rendering:pixelated}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{font:700 13px 'Noto Sans KR',system-ui;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--gold)}.btn.on{background:var(--gold);color:#120f1d}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.build{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;text-align:left;font-size:12px;margin:10px 0}
.build div{background:rgba(255,255,255,.04);border-radius:10px;padding:10px}
.build b{display:block;margin-bottom:4px;font-size:13px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:rgba(255,255,255,.05);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px;font-weight:900}
.sub{color:var(--sub);font-size:12px}
#err2{position:fixed;left:8px;right:8px;bottom:8px;display:none;z-index:50;background:rgba(120,20,40,.92);color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-weight:700;font-size:18px;padding:20px;text-align:center}
@media (max-width:700px){
  #tl{width:44vw}#mini{width:72px;height:72px}
  #tc{left:auto;right:94px;text-align:right;font-size:11px}#timer{font-size:20px}
  .sk{width:46px;height:46px;padding-top:14px;font-size:9px}
  #ultw{display:none}
  #touch button{width:52px;height:52px}
  #banner b{font-size:24px}
  #hint{display:none}
  .card{width:100%;min-height:0;padding:26px 12px 24px}
  #heroCards .card canvas{width:60px;height:auto;float:left;margin:0 12px 0 0}
  .panel{padding:16px}
  .panel h1{font-size:30px}
  #skills{bottom:14px;left:10px;gap:5px}
  #prompt{bottom:190px}
}
@media (max-height:500px){
  #heroPic canvas{width:40px;height:auto}.panel .sub{display:none}
  .panel{padding:12px 16px}.panel h1{font-size:24px;margin:0}.panel p{margin:2px 0 6px;font-size:12px}
  .card{min-height:0;padding:24px 10px 10px}.card .ds{font-size:11px}.cards{margin:6px 0}
  .tools .btn,.btn{min-height:40px;padding:6px 14px}
}
@media (prefers-reduced-motion:reduce){.card,#banner,.toast{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="txt"></canvas>
<div id="hud">
  <div id="tl"><div class="bar" id="hpb"><i></i><em></em></div><div class="bar" id="xpb"><i></i></div><div id="stats"></div><div id="hname"></div></div>
  <div id="tc"><div id="zinfo"></div><div id="timer"></div><div id="winfo"></div></div>
  <canvas id="mini" width="96" height="96"></canvas>
  <div id="bossbar"><div id="bname"></div><div class="bar"><i></i></div></div>
  <div id="banner"><b></b><span></span></div>
  <div id="toasts"></div>
  <div id="prompt"></div>
  <div id="skills"></div>
  <div id="ultw"><i></i><span>R</span></div>
  <div id="hint"></div>
  <div id="dbg"></div>
</div>
<div id="flash"></div><div id="vig"></div>
<div id="touch"><div id="joy"><i></i></div><button id="bJump">점프</button><button id="bUlt">궁</button><button id="bPause">II</button><button id="actBtn"></button></div>
<div id="ov"></div>
<div id="err"></div><div id="err2"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry32(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _hexC = new Map();
function hexRgb(c) { let v = _hexC.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; _hexC.set(c, v); } return v; }
function shade(c, k) { const [r, g, b] = hexRgb(c); return '#' + [r, g, b].map(v => clamp(Math.round(v * k * 255), 0, 255).toString(16).padStart(2, '0')).join(''); }
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

// ---------- data ----------
const ELEMENTS = {
  neutral: { name: '중립', color: '#c8c0a8', strong: [], weak: [] },
  fire: { name: '화염', color: '#ff7a3a', strong: ['forest', 'frost'], weak: ['fire', 'water'] },
  water: { name: '물', color: '#4aa8ff', strong: ['fire'], weak: ['water', 'forest'] },
  forest: { name: '숲', color: '#6ad04a', strong: ['water'], weak: ['fire', 'forest', 'venom'] },
  storm: { name: '번개', color: '#ffd23a', strong: ['water'], weak: ['storm', 'forest'] },
  frost: { name: '서리', color: '#9ae8ff', strong: ['forest'], weak: ['fire', 'water', 'frost'] },
  earth: { name: '대지', color: '#d0603a', strong: ['neutral', 'frost'], weak: ['venom', 'arcane'] },
  venom: { name: '독', color: '#b05ad8', strong: ['forest'], weak: ['venom'] },
  arcane: { name: '비전', color: '#ff6ab0', strong: ['earth', 'venom'], weak: ['arcane'] },
};
const CHART = {};
for (const a in ELEMENTS) { CHART[a] = {}; ELEMENTS[a].strong.forEach(d => CHART[a][d] = 2); ELEMENTS[a].weak.forEach(d => CHART[a][d] = .5); }

const STATUS = { ignite: '점화', soak: '침수', jolt: '경직', frostbite: '동상', toxin: '중독', daze: '현혹' };

// 아키타입 (§6.3). proj = 투사체형(플레이어 projectiles 능력치를 개수에 더함)
const ARCH = {
  bolt: { name: '투사체', dmg: 13, cd: 1.0, count: 1, area: .5, speed: 18, dur: 1.0, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'pierce', 'bounce', 'speed', 'crit'] },
  orb: { name: '폭발 구슬', dmg: 15, cd: 1.5, count: 1, area: 2.6, speed: 12.75, dur: 1.05, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'area', 'speed', 'status'] },
  lob: { name: '폭탄', dmg: 20, cd: 1.9, count: 1, area: 3.2, speed: 0, dur: 0, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'area', 'status'] },
  barrage: { name: '연사', dmg: 5, cd: 1.15, count: 4, area: .35, speed: 22.5, dur: .6, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'pierce', 'crit', 'speed'] },
  homing: { name: '유도', dmg: 9, cd: 1.25, count: 2, area: .5, speed: 11.25, dur: 1.6, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'speed', 'crit'] },
  beam: { name: '광선', dmg: 7, cd: 2.2, count: 1, area: 1.1, speed: 0, dur: .45, pierce: 999, proj: 1, knock: 0, ups: ['dmg', 'cd', 'area', 'dur', 'count', 'crit'] },
  cone: { name: '원뿔', dmg: 3.2, cd: 2.0, count: 1, area: 7, speed: 0, dur: 1.0, pierce: 999, proj: 0, knock: .3, ups: ['dmg', 'cd', 'area', 'dur', 'status'] },
  nova: { name: '충격파', dmg: 22, cd: 2.6, count: 1, area: 6.5, speed: 0, dur: 0, pierce: 999, proj: 0, knock: 1, ups: ['dmg', 'cd', 'area', 'status', 'crit'] },
  aura: { name: '오라', dmg: 4.5, cd: .45, count: 1, area: 3.6, speed: 0, dur: 0, pierce: 999, proj: 0, knock: 0, ups: ['dmg', 'cd', 'area', 'status'] },
  orbit: { name: '궤도', dmg: 9, cd: 5.5, count: 2, area: 3.2, speed: 3.2, dur: 4.0, pierce: 999, proj: 1, knock: 1, ups: ['dmg', 'count', 'area', 'dur', 'speed', 'cd'] },
  strike: { name: '일격', dmg: 17, cd: .95, count: 1, area: 3.3, speed: 0, dur: 0, pierce: 999, proj: 1, knock: 1, ups: ['dmg', 'cd', 'area', 'count', 'crit'] },
  chain: { name: '연쇄', dmg: 13, cd: 1.4, count: 3, area: 8, speed: 0, dur: 0, pierce: 0, proj: 1, knock: 1, ups: ['dmg', 'cd', 'count', 'area', 'status'] },
};
const ARCHETYPES = ARCH;
const UP_NAMES = { dmg: '피해', cd: '쿨다운', count: '개수', pierce: '관통', bounce: '튕김', area: '범위', speed: '속도', dur: '지속', crit: '치명타', status: '상태 확률' };

const SKILLS = [
  ['fire_arrow', '불티 화살', 'fire', 'bolt', 'mg', 'ignite', .25], ['lava_lump', '용암 덩이', 'fire', 'orb', 'mg', 'ignite', .30],
  ['flame_jet', '화염 분사', 'fire', 'cone', 'mg', 'ignite', .20], ['heat_burst', '열기 폭발', 'fire', 'nova', 'mg', 'ignite', .30],
  ['water_arrow', '물살 화살', 'water', 'bolt', 'mg', 'soak', .50], ['bubble_spray', '거품 난사', 'water', 'barrage', 'mg', 'soak', .40],
  ['jet_stream', '고압 수류', 'water', 'beam', 'mg', 'soak', .60], ['whirl_wave', '소용돌이 파동', 'water', 'nova', 'mg', 'soak', .70],
  ['thorn_seed', '추적 가시씨', 'forest', 'homing', 'ph', null, 0], ['bramble_slash', '가시 덩굴 베기', 'forest', 'strike', 'ph', null, 0],
  ['acorn_bomb', '도토리 폭탄', 'forest', 'lob', 'ph', null, 0], ['petal_ring', '꽃잎 고리', 'forest', 'orbit', 'mg', null, 0],
  ['chain_bolt', '연쇄 번개', 'storm', 'chain', 'mg', 'jolt', .25], ['static_field', '정전기 장막', 'storm', 'aura', 'mg', 'jolt', .10],
  ['thunder_lance', '뇌전 창', 'storm', 'beam', 'mg', 'jolt', .30], ['icicle_volley', '고드름 난사', 'frost', 'barrage', 'ph', 'frostbite', .35],
  ['frost_breath', '서리 숨결', 'frost', 'cone', 'mg', 'frostbite', .40], ['rock_fist', '바위 주먹', 'earth', 'strike', 'ph', null, 0],
  ['quake_slam', '지진 내려찍기', 'earth', 'nova', 'ph', null, 0], ['venom_spine', '독 가시', 'venom', 'homing', 'ph', 'toxin', .40],
  ['bog_aura', '독 늪 오라', 'venom', 'aura', 'mg', 'toxin', .25], ['arcane_orb', '비전 구체', 'arcane', 'orb', 'mg', 'daze', .15],
  ['arcane_ray', '비전 광선', 'arcane', 'beam', 'mg', 'daze', .20], ['shield_bash', '방패 밀치기', 'neutral', 'strike', 'ph', null, 0],
  ['meteor_shard', '유성 조각', 'neutral', 'homing', 'mg', null, 0],
].map(([id, name, el, arch, cls, status, chance]) => ({ id, name, el, arch, cls, status, chance }));
const SKILL_BY = Object.fromEntries(SKILLS.map(s => [s.id, s]));

class Spr {
  constructor(w, h) { this.w = w + 2; this.h = h + 2; this.p = new Array(this.w * this.h).fill(null); }

  set(x, y, c) { x = Math.floor(x) + 1; y = Math.floor(y) + 1; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = c; }

  modal = { kind: 'bless', items: blessChoices(bonus) };
  if (SIM) { pickChoice(0); return; }
  showPanel(`<div class="panel"><h2>${STR.blessTitle}</h2><p>${STR.blessSub}</p><div class="cards">${modal.items.map((x, i) => `<button class="card" data-i="${i}"><div class="tag" style="background:${RARITY[x.rar].color}">${RARITY[x.rar].name}</div><div class="row2">${iconImg('b_' + x.b.stat)}<div class="nm">${x.b.name}</div></div><div class="ds">${statText(x.b.stat, x.b.kind, x.v)}</div><div class="ky">${fmt(STR.key, { k: i + 1 })}</div></button>`).join('')}</div></div>`);
  ov.querySelectorAll('.card').forEach(b => b.onclick = () => pickChoice(+b.dataset.i));
}
function pickChoice(i) {
  const it = modal && modal.items[i]; if (!it) return;
  if (modal.kind === 'chest') applyRelic(it); else { P.blessings.push([it.b.stat, it.b.kind, it.v]); recompute(); logEv('bless', it.b.stat); }
  closeModal(); G.state = 'play';
}
function openPause() {
  if (G.state !== 'play') return;
  G.state = 'pause';
  const list = (arr) => arr.length ? arr.join('<br>') : STR.none;
  const sk = P.skills.filter(Boolean).map(s => `${iconImg('s_' + s.def.id, 20)}${s.def.name} Lv${s.level}`);
  const rn = [...P.runes].map(([id, r]) => `${iconImg('r_' + id, 20)}${RUNE_BY[id].name} Lv${r.lvl}`);
  const rl = [...P.relics].map(([id, n]) => `${iconImg('i_' + id, 20)}${RELIC_BY[id].name} ×${n}`);
  const bl = P.blessings.map(([s, k, v]) => statText(s, k, v));
  showPanel(`<div class="panel"><h2>${STR.pTitle}</h2><p>${P.hero.names[P.awaken]} · Lv ${P.lvl} · ${fmtTime(G.time)}</p>
    <div class="build"><div><b>${STR.buildSkills}</b>${list(sk)}</div><div><b>${STR.buildRunes}</b>${list(rn)}</div><div><b>${STR.buildRelics}</b>${list(rl)}</div><div><b>${STR.buildBless}</b>${list(bl)}</div></div>
    <div class="tools"><button class="btn on" id="resB">${STR.resume}</button><button class="btn" id="quitB">${STR.giveUp}</button></div></div>`);
  $('resB').onclick = resume; $('quitB').onclick = () => gameOver(false);
}
function resume() { if (G.state === 'pause') { closeModal(); G.state = 'play'; } }
function gameOver(win) {
  G.state = 'over'; G.won = win; logEv(win ? 'win' : 'lose', G.zone);
  logEv('summary', { jumps: G.jumps, highGroundSec: +G.highT.toFixed(1), time: +G.time.toFixed(1), kills: G.kills, lvl: P.lvl });
  if (SIM) return;
  const score = Math.round((G.kills * 2 + G.time * 3 + G.dmgTotal / 200 + (G.zone - 1) * 1500 + G.bosses * 800 + (win ? 6000 : 0)) * (1 + .5 * G.diffIdx));
  let medal = '';
  if (win) { const r = 1 + .05 * G.diffIdx, t = G.time; medal = STR.medals[t <= 630 * r ? 0 : t <= 900 * r ? 1 : t <= 1260 * r ? 2 : 3]; }
  showPanel(`<div class="panel"><h1>${win ? STR.win : STR.lose}</h1><p>${P.hero.names[P.awaken]} · ${G.diff.name}</p>
    <div class="stat"><div><span class="sub">${STR.score}</span><b>${score.toLocaleString()}</b></div><div><span class="sub">${STR.time}</span><b>${fmtTime(G.time)}</b></div><div><span class="sub">${STR.kills}</span><b>${G.kills}</b></div>
    <div><span class="sub">${STR.level}</span><b>${P.lvl}</b></div><div><span class="sub">${STR.bosses}</span><b>${G.bosses}</b></div><div><span class="sub">${STR.medal}</span><b>${medal || '—'}</b></div></div>
    <p>${STR.scoreFormula}</p>
    <div class="tools"><button class="btn on" id="againB">${STR.retry}</button><button class="btn" id="logB">${STR.copyLog}</button></div></div>`);
  $('againB').onclick = showTitle;
  $('logB').onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(G.log)); toast(STR.copied); } catch (_) { } };
}
function onKey(code) {
  const s = G.state;
  if (s === 'menu') {
    if (code === 'ArrowLeft') menuSel.skill = (menuSel.skill + 2) % 3; else if (code === 'ArrowRight') menuSel.skill = (menuSel.skill + 1) % 3;
    else if (code === 'ArrowUp') menuSel.diff = (menuSel.diff + 2) % 3; else if (code === 'ArrowDown') menuSel.diff = (menuSel.diff + 1) % 3;
    else if (/^Digit[1-3]$/.test(code)) menuSel.skill = +code[5] - 1;
    else if (code === 'Enter') { startGame(); return; }
    refreshTitle();
  } else if (s === 'play') {
    if (code === 'Space') req.jump = 1; else if (code === 'KeyE') req.interact = 1; else if (code === 'KeyR') req.ult = 1;
    else if (code === 'Escape' || code === 'KeyP') openPause();
  } else if (s === 'levelup') {
    if (/^Digit[1-3]$/.test(code)) pickLevel(+code[5] - 1); else if (code === 'KeyF') levelTool('F'); else if (code === 'KeyX') levelTool('X'); else if (code === 'KeyZ') levelTool('Z');
  } else if (s === 'choice') {
    if (/^Digit[1-3]$/.test(code)) pickChoice(+code[5] - 1);
    else if (code === 'KeyS' && modal && modal.kind === 'chest') $('sellB').click();
  } else if (s === 'pause') {
    if (code === 'Escape' || code === 'KeyP') resume(); else if (code === 'KeyQ') gameOver(false);
  } else if (s === 'over') { if (code === 'Enter') showTitle(); }
}

// ---------- loop ----------
let last = performance.now();
// 루프 안에서 에러가 나도 다음 프레임은 반드시 예약한다(에러 한 번에 화면이 영구히 멈추던 것 방지).
// 에러 내용은 화면 아래에 띄우고 로그에 남겨, 재현이 안 되는 멈춤도 원인을 알 수 있게 한다.
let lastErrAt = -9;
function reportError(e, where) {
  const msg = `${where}: ${e && e.message || e}`;
  console.error(msg, e);
  const t = performance.now() / 1000;
  if (t - lastErrAt > 3) { lastErrAt = t; if (G && G.log) logEv('error', msg.slice(0, 200)); const el = $('err2'); el.textContent = STR.errShown + ' ' + msg + (e && e.stack ? ' · ' + (e.stack.split('\n')[1] || '').trim() : ''); el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 8000); }
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  try {
    if (G.state === 'play') update(dt);
    else if (G.state === 'transition') { G.transT -= dt; if (G.transT <= 0) finishTransition(); }
  } catch (e) { reportError(e, 'update'); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
  try { render(dt); } catch (e) { reportError(e, 'render'); }
}
addEventListener('error', e => reportError(e.error || e.message, 'script'));
addEventListener('unhandledrejection', e => reportError(e.reason, 'promise'));
function botStep() {
  let best = null, bd = 1600;
  for (const p of pickups) { const d = (p.x - P.x) ** 2 + (p.y - P.y) ** 2; if (d < bd) { bd = d; best = p; } }
  if (best) { const d = Math.sqrt(bd) || 1; BOT.x = (best.x - P.x) / d; BOT.y = (best.y - P.y) / d; }
  else { const a = G.time * .35; BOT.x = -Math.sin(a); BOT.y = Math.cos(a); if (Math.hypot(P.x - CX, P.y - CY) > 30) { const d = Math.hypot(CX - P.x, CY - P.y); BOT.x = (CX - P.x) / d; BOT.y = (CY - P.y) / d; } }
}
window.__game = {
  get G() { return G; }, get P() { return P; }, get E() { return E; },
  start(skillIdx = 1, diffIdx = 0) { if (G.state !== 'menu') showTitle(); menuSel.skill = skillIdx; menuSel.diff = diffIdx; startGame(); return true; },
  simulate(seconds, dt = 1 / 30) {
    SIM = true;
    const steps = Math.round(seconds / dt);
    try {
      for (let k = 0; k < steps; k++) {
        if (G.state === 'over') break;
        if (G.state === 'transition') { finishTransition(); continue; }
        if (G.state === 'pause') resume();
        if (G.state === 'levelup') { pickLevel(0); continue; }
        if (G.state === 'choice') { if (modal && modal.kind === 'bless') pickChoice(0); else { closeModal(); G.state = 'play'; } continue; }
        botStep(); update(dt);
      }
    } finally { SIM = false; }
    return { t: +G.zoneTime.toFixed(1), lvl: P.lvl, kills: G.kills, enemies: E.n, skills: P.skills.filter(Boolean).length, state: G.state };
  },
  jump() { req.jump = 1; }, grantXp(v) { gainXp(v); }, spawnBoss() { spawnBoss(); },
  skipTo(s) { G.zoneTime = s; while (G.tlI < G.timeline.length && G.timeline[G.tlI].t < s) G.tlI++; },
  god(on = true) { P.god = on; },
};

// 시작: 타이틀 뒤 배경으로 구역 1 지형을 깔아 둔다
resize();
genTerrain(0, 12345); buildTerrainMesh(); applyLook(0);
// DECISION: 모든 재질의 셰이더를 타이틀에서 미리 컴파일한다. 첫 플레이 프레임에 컴파일하느라 한 번 멈추던 문제
try { renderer.compile(scene, camera); } catch (_) { }
showTitle();
requestAnimationFrame(loop);
</script>
