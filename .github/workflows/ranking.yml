name: ranking
# 게임에서 "랭킹에 등록"을 누르면 열리는 이슈(라벨 ranking)를 읽어 ranking.json에 기록을 더하고 이슈를 닫는다.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: ranking
  cancel-in-progress: false
jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'ranking') || startsWith(github.event.issue.title, '[랭킹]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 기록 검사하고 ranking.json에 더하기
        run: node .github/scripts/add-ranking.js
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
      - name: 커밋·푸시
        run: |
          if git diff --quiet ranking.json; then exit 0; fi
          git config user.name "dream-knight-ranking"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.json
          git commit -m "ranking: #${{ github.event.issue.number }} 기록 추가"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 결과 알리고 이슈 닫기
        if: always()
        run: node .github/scripts/add-ranking.js --notify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
